<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Summa turns any page — articles, emails, image-heavy sites, docs, threads — into 5 main points plus a full non-redundant summary. One click, runs locally, free." />
    <meta name="theme-color" content="#0c1a16" />
    <link rel="canonical" href="https://www.contentsummarize.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.contentsummarize.com/" />
    <meta property="og:title" content="Summa — Summarize any page on the internet" />
    <meta property="og:description" content="5 main points + a full non-redundant summary of any page, in one click. Tuned for articles, emails, image-heavy pages, docs, and threads." />
    <meta property="og:image" content="https://www.contentsummarize.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-512.png" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Summa" />
    <title>Summa — Summarize any page | contentsummarize.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- ===== AI Toolkit switcher — Summa ===== -->
<div id="smToolkit" style="position:fixed;top:16px;right:16px;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <style>
    #smToolkit *{box-sizing:border-box;margin:0;padding:0;}
    #smToolkitBtn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #fde68a;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;color:#92400e;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.08);}
    #smToolkitBtn:hover{background:#fffbeb;}
    #smToolkitPanel{display:none;position:absolute;right:0;top:calc(100% + 8px);width:292px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.14);overflow:hidden;}
    #smToolkit.open #smToolkitPanel{display:block;}
    .smRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;text-decoration:none;border-bottom:1px solid #f1f5f9;}
    .smRow:last-child{border-bottom:none;}
    a.smRow[href]:hover{background:#f8fafc;}
    .smName{font-size:13px;font-weight:700;color:#0f172a;display:block;}
    .smDesc{font-size:11px;color:#64748b;display:block;margin-top:2px;}
    .smBadge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;}
  </style>

  <button id="smToolkitBtn" onclick="smToolkitToggle(event)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    AI Toolkit
    <svg id="smChevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .2s;"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div id="smToolkitPanel">
    <a id="smPfLink" class="smRow" href="#">
      <span style="display:flex;align-items:center;gap:10px;">
        <span style="display:flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:9px;background:#eef2ff;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 10-13h-7V2Z"/></svg>
        </span>
        <span><span class="smName">PromptForge</span><span class="smDesc">Create, improve &amp; test AI prompts.</span></span>
      </span>
      <span id="smPfBadge" class="smBadge" style="background:#eef2ff;color:#4338ca;">Coming soon</span>
    </a>

    <a class="smRow" href="https://naturalwrite-nu.vercel.app/" target="_blank" rel="noopener">
      <span style="display:flex;align-items:center;gap:10px;">
        <span style="display:flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:9px;background:#ecfdf5;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span>
        <span><span class="smName">NaturalWrite</span><span class="smDesc">Clear, natural writing from your ideas.</span></span>
      </span>
      <span class="smBadge" style="color:#047857;">Open →</span>
    </a>

    <div class="smRow">
      <span style="display:flex;align-items:center;gap:10px;">
        <span style="display:flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:9px;background:#fffbeb;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h9"/></svg>
        </span>
        <span><span class="smName">Summa</span><span class="smDesc">Turn long content into useful summaries.</span></span>
      </span>
      <span class="smBadge" style="background:#fffbeb;color:#b45309;">You are here</span>
    </div>
  </div>
</div>

<script>
  // When PromptForge goes live, paste its address between the quotes:
  var SM_PROMPTFORGE_URL = "";

  (function () {
    var link = document.getElementById("smPfLink");
    if (SM_PROMPTFORGE_URL) {
      link.href = SM_PROMPTFORGE_URL;
      link.target = "_blank";
      link.rel = "noopener";
      document.getElementById("smPfBadge").textContent = "Open →";
    } else {
      link.removeAttribute("href");
      link.style.cursor = "default";
    }
  })();

  function smToolkitToggle(e) {
    e.stopPropagation();
    var root = document.getElementById("smToolkit");
    root.classList.toggle("open");
    document.getElementById("smChevron").style.transform =
      root.classList.contains("open") ? "rotate(180deg)" : "rotate(0deg)";
  }

  document.addEventListener("click", function (e) {
    var root = document.getElementById("smToolkit");
    if (root && !root.contains(e.target)) {
      root.classList.remove("open");
      document.getElementById("smChevron").style.transform = "rotate(0deg)";
    }
  });
</script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
